name: Validate Android templates

on:
  workflow_dispatch:
  push:
    paths:
      - 'skills/readiz-webapp-android/assets/starter/**'
      - 'skills/readiz-webapp-android/scripts/create_app.py'
      - 'examples/*.json'
      - 'tests/verify_android.py'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'skills/readiz-webapp-android/assets/starter/**'
      - 'skills/readiz-webapp-android/scripts/create_app.py'
      - 'examples/*.json'
      - 'tests/verify_android.py'
      - '.github/workflows/android.yml'

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'
          cache-disabled: true
      - name: Check Android SDK and build tools
        run: |
          test -f "$ANDROID_HOME/platforms/android-36/android.jar"
          test -x "$ANDROID_HOME/build-tools/35.0.0/aapt2"
          java -version
          gradle --version
      - name: Compile, test and lint both generated apps
        run: python3 -B tests/verify_android.py --out "$RUNNER_TEMP/android-validation"
      - name: Preserve test reports and source identity
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-validation-${{ github.sha }}
          path: ${{ runner.temp }}/android-validation/reports/
          if-no-files-found: warn
          retention-days: 14
